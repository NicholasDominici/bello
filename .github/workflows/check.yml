name: Check Bell

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bell_test
          POSTGRES_PASSWORD: bell_test
          POSTGRES_DB: bell_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bell_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_LINK_DATABASE_URL: postgresql://bell_test:bell_test@127.0.0.1:5432/bell_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
